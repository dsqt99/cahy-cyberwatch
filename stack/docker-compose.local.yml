# Project name pinned so the existing n8n_workflow_cahy_n8n_* data volumes are reused
name: n8n_workflow

services:
  n8n_postgres:
    image: postgres:16-alpine
    container_name: cahy_n8n_postgres
    restart: unless-stopped
    ports:
      # host port from .env; 5433 is often taken by other local Postgres
      - "${POSTGRES_EXTERNAL_PORT:-5435}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=n8n
    volumes:
      - cahy_n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - cahy_n8n_local_net

  postgres_api:
    build:
      context: ./postgres-api
      dockerfile: Dockerfile
    image: cahy-postgres-api:latest
    container_name: cahy_postgres_api
    restart: unless-stopped
    depends_on:
      n8n_postgres:
        condition: service_healthy
    ports:
      - "5434:5434"
    environment:
      - PG_API_PORT=5434
      - PG_HOST=n8n_postgres
      - PG_PORT=5432
      - PG_USER=${POSTGRES_USER:-postgres}
      - PG_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PG_EXTERNAL_PORT=${POSTGRES_EXTERNAL_PORT:-5435}
      # empty = server.js built-in fallback; set a random value in .env for real deployments
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-}
      - PG_DATABASE=cahy_cyberwatch
      - INIT_SQL_PATH=/app/init-cahy-db.sql
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./postgres/init-cahy-db.sql:/app/init-cahy-db.sql:ro
    networks:
      - cahy_n8n_local_net

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: cahy-n8n-local:latest
    container_name: cahy_n8n_local
    restart: unless-stopped
    depends_on:
      n8n_postgres:
        condition: service_healthy
      postgres_api:
        condition: service_started
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n_postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,crypto,url,buffer
      - N8N_RESTRICT_FILE_ACCESS_TO=/screenshots;/home/node/.n8n-files;/tmp
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_PUBLIC_API_ENABLED=true
      - N8N_PUBLIC_API_SWAGGER_UI_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - cahy_n8n_local_data:/home/node/.n8n
      # host folder the Electron app writes screenshots to (repo-root/screenshots by default)
      - ${SCREENSHOT_HOST_DIR:-../screenshots}:/screenshots
      - ./:/workflows:ro
    networks:
      - cahy_n8n_local_net

volumes:
  cahy_n8n_pgdata:
  cahy_n8n_local_data:

networks:
  cahy_n8n_local_net:
    driver: bridge
