services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=n8n
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - n8nnet

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-docker:latest
    ports:
      - "1234:1234"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      - N8N_HOST=n8n.anm05.com
      - N8N_PORT=1234
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.anm05.com
      - N8N_EDITOR_BASE_URL=https://n8n.anm05.com
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXPRESS_TRUST_PROXY=true
      - N8N_RUNNERS_ENABLED=true
      - NODE_OPTIONS=--max-old-space-size=8192
      - N8N_PUBLIC_API_ENABLED=true
      - N8N_PUBLIC_API_SWAGGER_UI_ENABLED=true
      - N8N_PUBLIC_API_PATH=api
    volumes:
      - ./data:/home/node/.n8n
    networks:
      - n8nnet
    restart: always

  nginx-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - "80:80"     # HTTP
      - "81:81"     # Admin UI
      - "443:443"   # HTTPS
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./data/screenshot:/home/node/.n8n/screenshot
    networks:
      - n8nnet

networks:
  n8nnet:
    driver: bridge